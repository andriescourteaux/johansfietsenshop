[build]
  command = "if command -v hugo >/dev/null 2>&1; then hugo; else mkdir -p /tmp/hugo-bin && curl -sL \"https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz\" | tar -xz -C /tmp/hugo-bin hugo && /tmp/hugo-bin/hugo; fi"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.163.3"
